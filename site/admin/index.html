<!doctype html>
<html lang="pt-BR"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1" /><meta name="theme-color" content="#071321" /><meta name="description" content="Importação e gestão Elite do Ranking Promo Moto." /><title>Administração · Ranking Promo Moto</title><link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" /><link rel="stylesheet" href="/assets/styles.css" /></head>
<body data-page="admin"><header class="topbar"><a class="brand" href="/" aria-label="Voltar para o ranking"><span class="brand-mark">R</span><span>Ranking <b>Promo</b></span></a></header><section id="admin-lock" class="admin-lock"><form id="admin-login" class="login-card"><h1>Administração</h1><input id="admin-password" type="password" inputmode="numeric" autocomplete="current-password" placeholder="Senha" aria-label="Senha" required /><button class="primary-button" type="submit">Entrar</button><p id="login-status" class="form-status" role="status"></p></form></section><main id="admin-content" class="shell admin-shell" hidden><section class="admin-grid"><article class="admin-card"><h1>Importar planilha</h1><label class="file-drop" for="excel-file"><input id="excel-file" type="file" accept=".xlsx,.xls" /><span class="file-title">Selecionar arquivo</span><span id="file-name" class="file-name">Nenhum arquivo selecionado</span></label><button id="import-button" class="primary-button" type="button">Importar</button><p id="import-status" class="form-status" role="status"></p></article><article class="admin-card elite-card"><h1>Entregadores Elite</h1><textarea id="elite-ids" placeholder="Cole os IDs aqui"></textarea><div class="admin-actions"><button id="save-elite-button" class="primary-button gold-button" type="button">Salvar</button><button id="delete-elite-button" class="danger-button" type="button">Apagar lista atual</button></div><p id="elite-status" class="form-status" role="status"></p></article></section></main><script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script><script src="/config.js"></script><script src="/assets/app.js"></script></body></html>
